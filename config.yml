# Configuración del buscador. Edita este archivo directamente en GitHub
# y el próximo chequeo (cada hora, de 7:00 a 22:00) usará los valores nuevos.

# ---------------------------------------------------------------------------
# PALABRAS CLAVE (según CV: TM en Imagenología y Física Médica, 14 años en RM,
# experiencia en TC y radiografía, gestión de sucursal)
# Cada término se busca en 5 sitios cada hora: conviene no pasar de unos 8.
# ---------------------------------------------------------------------------
palabras_clave:
  # Foco principal: resonancia magnética
  - tecnólogo médico resonancia
  - resonancia magnética
  # Imagenología general, TC y radiografía
  - tecnólogo médico imagenología
  - tecnólogo médico scanner
  - tecnólogo médico radiología
  # Empresas de equipos (Siemens Healthineers, GE HealthCare, Philips…)
  - especialista de aplicaciones
  # Jefatura y coordinación
  - coordinador imagenología
  - jefe imagenología

# Sitios donde cada palabra con tildes se busca también sin tildes
# ("tecnologo medico"), por si su buscador las distingue. En LinkedIn, Indeed y
# Google no hace falta: ya las ignoran. Cada sitio agregado suma ~6 búsquedas.
sin_tildes_en:
  - computrabajo
  - chiletrabajos
  - trabajando
  - laborum

# ---------------------------------------------------------------------------
# PERFIL OBJETIVO: clasifica cada aviso según su título (y la empresa, para
# "afin"). Se compara sin tildes ni mayúsculas, por palabra completa; con *
# al final acepta cualquier palabra que empiece así.
#   prioritario → se marca con ⭐ y aparece primero
#   afin        → aviso relacionado con tu formación
# ---------------------------------------------------------------------------
perfil:
  prioritario:
    - resonancia*
    - resonador*
    - cardioresonancia
    # "RM" no se usa sola: en los avisos suele significar Región Metropolitana.
    - RMN
    - MRI
    - MR
    - Siemens Healthineers
    - GE HealthCare
  afin:
    - imagenolog*
    - imagen
    - imagenes
    - scanner
    - escáner
    - tomograf*
    - TC
    - TAC
    - radiolog*
    - rayos
    - radiograf*
    - mamograf*
    - ecograf*
    - densitometr*
    - física médica
    - especialista clínico
    - tecnólogo médico
    - tecnologo medico
    - TM
  # Fabricantes de equipos: un aviso de estas empresas cuenta como afín solo si
  # el título calza con "cargos_en_esas_empresas" (evita cargos de finanzas, TI…).
  empresas_del_rubro:
    - Siemens*
    - GE HealthCare
    - Philips
    - Canon Medical
    - United Imaging
    - Fujifilm
    - Agfa
  cargos_en_esas_empresas:
    - aplicacion*
    - application*
    - clinic*
    - especialista
    - specialist
    - tecnolog*
    - technolog*
    - educacion*
    - education*

# true = descarta los avisos que no calzan ni con "prioritario" ni con "afin"
# (filtra ruido como cargos de ventas o avisos de otras áreas).
solo_afines: true

# Se descartan los avisos cuyo título contenga alguno de estos términos
# (mismas reglas de comparación que el perfil). También limpia el historial.
excluir:
  - TENS
  - técnico en enfermería
  - auxiliar
  - laboratorio
  - banco de sangre
  - oftalmolog*
  - otorrino*
  - técnico en imagen*
  - administrativ*
  - técnico radiólogo
  - ginecolog*

