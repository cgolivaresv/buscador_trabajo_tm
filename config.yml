# ---------------------------------------------------------------------------
# PÁGINAS VIGILADAS: páginas de "trabaja con nosotros" de centros que publican
# vacantes solo en su propio sitio. Si el texto de la página cambia, se abre un
# issue con lo nuevo. Se respeta el robots.txt de cada sitio.
#   nombre:   cómo se verá en el aviso
#   url:      dirección de la página
#   selector: (opcional) parte de la página a vigilar, como selector CSS, para
#             ignorar cambios del resto (menús, banners). Ej: "#ofertas", ".empleos"
# ---------------------------------------------------------------------------
vigilar: []
# Ejemplo:
#   - nombre: Clínica Ejemplo · Trabaja con nosotros
#     url: https://www.clinicaejemplo.cl/trabaja-con-nosotros
#     selector: main

# Sitios a revisar (true = activo).
sitios:
  linkedin: true
  computrabajo: true
  chiletrabajos: true
  trabajando: true
  indeed: true
  laborum: true
  google: true

# Abre un issue en GitHub con los avisos nuevos (GitHub te avisa por correo).
notificar_issue: true

# Antigüedad máxima de un aviso al encontrarlo, en horas (0 = sin límite). Los
# sitios que filtran por fecha la usan al buscar; en el resto se lee la fecha de
# publicación del aviso ("Hace 3 días", "2026-10-28"…). Los avisos sin fecha
# reconocible se admiten. El límite solo decide qué avisos NUEVOS entran: los ya
# guardados no se borran por antigüedad, y siguen visibles mientras estén abiertos.
antiguedad_maxima_horas: 48

# Días sin volver a ver un aviso antes de borrarlo del historial.
dias_retencion: 60
