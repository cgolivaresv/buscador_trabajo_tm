name: Diagnóstico Trabajando

on:
  workflow_dispatch:
    inputs:
      palabra:
        description: "Palabra clave de prueba"
        default: "tecnologo medico"

permissions:
  contents: write

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m buscador.diagnostico "${{ inputs.palabra }}"
      - name: Guardar diagnóstico
        run: |
          git config user.name "buscador-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debug
          git commit -m "Diagnóstico Trabajando.cl" || exit 0
          git pull --rebase --autostash
          git push
