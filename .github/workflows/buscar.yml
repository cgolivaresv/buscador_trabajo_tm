name: Buscar avisos

on:
  schedule:
    - cron: "17 */2 * * *"   # cada 2 horas (minuto 17 para evitar la congestión de la hora en punto)
  workflow_dispatch:          # botón "Run workflow" para ejecutarlo a mano

permissions:
  contents: write
  issues: write

concurrency:
  group: buscar-avisos
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Revisar portales
        id: buscar
        run: |
          python -m buscador --nuevos nuevos.md || echo "fallo=1" >> "$GITHUB_OUTPUT"
          if [ -s nuevos.md ]; then echo "hay_nuevos=1" >> "$GITHUB_OUTPUT"; fi

      - name: Guardar resultados
        run: |
          git config user.name "buscador-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Avisos: chequeo $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase --autostash
            git push
          fi

      - name: Avisar por issue
        if: steps.buscar.outputs.hay_nuevos == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if grep -Eq '^notificar_issue:[[:space:]]*true' config.yml; then
            gh issue create \
              --title "Nuevos avisos · $(TZ=America/Santiago date +'%d-%m %H:%M')" \
              --body-file nuevos.md
          fi

      - name: Marcar fallo si ningún sitio respondió
        if: steps.buscar.outputs.fallo == '1'
        run: |
          echo "::error::Ningún portal devolvió resultados. Revisa docs/data/estado.json."
          exit 1
