name: Buscar avisos

on:
  schedule:
    # Cada hora, de 7:00 a 22:00 hora de Chile. GitHub programa en UTC y Chile cambia
    # entre UTC-3 (verano) y UTC-4 (invierno), así que se cubren ambos horarios y el
    # paso "Revisar horario" descarta lo que cae fuera de rango. Minuto 17 para evitar
    # la congestión de la hora en punto.
    - cron: "17 0-2,10-23 * * *"
  workflow_dispatch:          # botón "Run workflow" para ejecutarlo a mano

permissions:
  contents: write
  issues: write

concurrency:
  group: buscar-avisos
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Revisar horario (7:00 a 22:00 en Chile)
        id: horario
        run: |
          h=$(TZ=America/Santiago date +%-H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || { [ "$h" -ge 7 ] && [ "$h" -le 22 ]; }; then
            echo "correr=1" >> "$GITHUB_OUTPUT"
          else
            echo "Son las $h:xx en Chile, fuera del horario de chequeo."
          fi

      - uses: actions/checkout@v4
        if: steps.horario.outputs.correr == '1'

      - uses: actions/setup-python@v5
        if: steps.horario.outputs.correr == '1'
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
        if: steps.horario.outputs.correr == '1'

      - name: Revisar portales
        id: buscar
        if: steps.horario.outputs.correr == '1'
        run: |
          python -m buscador --nuevos nuevos.md --acciones acciones.json || echo "fallo=1" >> "$GITHUB_OUTPUT"
          if [ -s nuevos.md ]; then echo "hay_nuevos=1" >> "$GITHUB_OUTPUT"; fi

      - name: Guardar resultados
        if: steps.horario.outputs.correr == '1'
        run: |
          git config user.name "buscador-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Avisos: chequeo $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase --autostash
            git push
          fi

      - name: Alertas de salud y páginas vigiladas
        if: steps.horario.outputs.correr == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m buscador.issues acciones.json

      - name: Avisar por issue
        if: steps.buscar.outputs.hay_nuevos == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if grep -Eq '^notificar_issue:[[:space:]]*true' config.yml; then
            gh issue create \
              --title "Nuevos avisos · $(TZ=America/Santiago date +'%d-%m %H:%M')" \
              --body-file nuevos.md
          fi

      - name: Marcar fallo si ningún sitio respondió
        if: steps.buscar.outputs.fallo == '1'
        run: |
          echo "::error::Ningún portal devolvió resultados. Revisa docs/data/estado.json."
          exit 1
